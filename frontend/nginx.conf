server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Gehashte Asset-Dateien (JS/CSS mit Content-Hash im Dateinamen, siehe Vite-Build)
    # dürfen dauerhaft gecacht werden - eine neue Version bekommt automatisch einen
    # neuen Dateinamen, es gibt also nie eine veraltete Datei unter derselben URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html, Manifest und Service Worker NIE cachen: sonst bekommen Nutzer nach
    # einem neuen Deployment weiter die alte Version ausgeliefert, bis sie manuell den
    # Cache leeren - und der Service Worker prüft nur zuverlässig auf Updates, wenn die
    # sw.js-Datei selbst nicht gecacht wird. Zusätzlich braucht manifest.json den
    # korrekten Content-Type, damit Browser (u.a. Samsung Internet) die Seite überhaupt
    # als installierbare PWA erkennen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
